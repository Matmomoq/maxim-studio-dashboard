<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#132824">
  <title>Вход · Управленческая аналитика</title>
  <meta name="robots" content="noindex, nofollow">
  <style>{{ inline_css | safe }}</style>
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="loginTitle">
      <p class="section-kicker">Закрытый раздел</p>
      <h1 id="loginTitle">Вход в дашборд</h1>
      <p class="login-copy">Введите логин и пароль, выданные администратором.</p>

      {% if error %}
        <div class="login-error" role="alert">{{ error }}</div>
      {% endif %}

      <form class="login-form" method="post" action="{{ url_for('login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="next" value="{{ next_url }}">
        <label>
          <span>Логин</span>
          <input name="username" type="text" autocomplete="username" required autofocus {% if not configured %}disabled{% endif %}>
        </label>
        <label>
          <span>Пароль</span>
          <input name="password" type="password" autocomplete="current-password" required {% if not configured %}disabled{% endif %}>
        </label>
        <button type="submit" {% if not configured %}disabled{% endif %}>Войти</button>
      </form>

      <p class="login-note">Доступ разрешён только сотрудникам компании.</p>
    </section>
  </main>
</body>
</html>
